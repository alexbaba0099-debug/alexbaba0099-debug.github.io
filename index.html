<script>
(function(){
  var SIFRE = "3131";
  var gate = document.getElementById("gate");
  var input = document.getElementById("gatePass");
  var btn = document.getElementById("gateButton");
  var err = document.getElementById("gateError");
  var burst = document.getElementById("loveBurst");
  var start = new Date(2026,0,1,0,0,0);
  function tick(){
    var now = new Date();
    var d = Math.floor((now - start)/1000);
    if(d < 0) d = 0;
    document.getElementById("days").textContent = Math.floor(d/86400);
    document.getElementById("hours").textContent = Math.floor((d%86400)/3600);
    document.getElementById("minutes").textContent = Math.floor((d%3600)/60);
    document.getElementById("seconds").textContent = d%60;
  }
  setInterval(tick,1000); tick();
  function ac(){
    if(input.value.trim() === SIFRE){
      err.textContent = "";
      burst.classList.add("show");
      for(var i=0;i<25;i++){
        var h = document.createElement("div");
        h.className = "burst-heart";
        h.textContent = ["💗","💖","💕","🤍","💞","❤️"][Math.floor(Math.random()*6)];
        h.style.setProperty("--x", (Math.random()*200-100)+"vw");
        h.style.setProperty("--y", (Math.random()*200-100)+"vh");
        h.style.setProperty("--s", (Math.random()*2+1));
        h.style.setProperty("--r", (Math.random()*720-360)+"deg");
        burst.appendChild(h);
      }
      setTimeout(function(){
        gate.style.transition = "opacity .6s";
        gate.style.opacity = "0";
        setTimeout(function(){ gate.style.display = "none"; }, 600);
      }, 1000);
    } else {
      err.textContent = "Şifre yanlış, tekrar dene 💗";
      input.value = "";
      input.focus();
    }
  }
  btn.addEventListener("click", ac);
  input.addEventListener("keydown", function(e){ if(e.key === "Enter") ac(); });
})();
</script>
