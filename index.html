<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALEXIX SİSTEM</title>
    <style>
        /* Temel sıfırlama */
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { background:#000; color:#fff; font-family:'Segoe UI',Roboto,sans-serif; overflow-x:hidden; padding-bottom:70px; }

        /* Üst bar */
        .topbar { background:#0a0a0a; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; border-bottom:1px solid #1a1a1a; }
        .topbar .left { display:flex; align-items:center; gap:12px; }
        .hamburger { width:26px; height:20px; display:flex; flex-direction:column; justify-content:space-between; cursor:pointer; }
        .hamburger span { display:block; height:3px; background:#e74c3c; border-radius:2px; }
        .logo { font-size:1.3rem; font-weight:800; letter-spacing:1px; color:#fff; }
        .topbar .right { display:flex; gap:8px; }
        .topbar .right button { background:transparent; border:1px solid #333; color:#fff; padding:7px 14px; border-radius:6px; font-size:.85rem; font-weight:600; cursor:pointer; }
        .topbar .right button:hover { background:#1a1a1a; }

        /* Komut listesi */
        .cmd-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:14px; }
        .cmd-card { background:#0d0d0d; border:1px solid #1f1f1f; border-radius:10px; padding:14px; display:flex; flex-direction:column; justify-content:space-between; min-height:110px; }
        .cmd-card .num { font-size:.7rem; color:#555; margin-bottom:6px; }
        .cmd-card .cmd { color:#e74c3c; font-weight:700; font-size:.9rem; word-break:break-all; }
        .cmd-card .desc { color:#888; font-size:.78rem; margin-top:4px; flex:1; }
        .cmd-card .run { align-self:flex-end; background:transparent; border:1px solid #444; color:#fff; padding:6px 16px; border-radius:6px; font-size:.75rem; font-weight:600; cursor:pointer; margin-top:8px; }
        .cmd-card .run:hover { background:#e74c3c; border-color:#e74c3c; }
        .cmd-card.active { border-color:#e74c3c; }

        /* Alt bar (müzik) */
        .bottombar { position:fixed; bottom:0; left:0; right:0; background:#0a0a0a; border-top:1px solid #1a1a1a; padding:8px 14px; display:flex; align-items:center; justify-content:space-around; z-index:100; }
        .bottombar .icon { color:#666; font-size:1.4rem; cursor:pointer; }
        .bottombar .icon.active { color:#e74c3c; }

        /* Modal */
        .modal { position:fixed; inset:0; background:rgba(0,0,0,0.92); display:none; justify-content:center; align-items:center; z-index:200; }
        .modal.active { display:flex; }
        .modal-box { background:#0d0d0d; border:1px solid #222; border-radius:12px; padding:24px; width:90%; max-width:360px; }
        .modal-box h2 { color:#e74c3c; margin-bottom:16px; text-align:center; font-size:1.1rem; }
        .modal-box input { width:100%; padding:12px; margin-bottom:12px; background:#000; border:1px solid #333; border-radius:6px; color:#fff; }
        .modal-box button { width:100%; padding:12px; background:#e74c3c; color:#fff; border:none; border-radius:6px; font-weight:700; cursor:pointer; }
        .close { float:right; color:#e74c3c; cursor:pointer; font-size:1.2rem; }

        /* Bildirim */
        .toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:#e74c3c; color:#fff; padding:10px 20px; border-radius:6px; font-size:.85rem; display:none; z-index:300; }
    </style>
</head>

            {n:"Beautiful Things", a:"Benson Boone"},
            {n:"Die With A Smile", a:"Lady Gaga Bruno Mars"},
            {n:"Stumblin' In", a:"CYRIL"},
            {n:"lovely", a:"Billie Eilish Khalid"},
            {n:"Another Love", a:"Tom Odell"},
            {n:"Let Her Go", a:"Passenger"},
            {n:"Arcade", a:"Duncan Laurence"},
            {n:"Someone You Loved", a:"Lewis Capaldi"},
            {n:"Комета", a:"JONY"},
            {n:"Плакала", a:"KAZKA"},
            {n:"Розовое вино", a:"Элджей Feduk"},
            {n:"Yananı Görür Allah", a:"Yananı Görür Allah"},
            {n:"Yakında Gelecek", a:"Yakında"}
        ];

        /* Komut kartlarını oluştur */
        function renderCommands() {
            const grid = document.getElementById('cmdGrid');
            grid.innerHTML = '';
            commands.forEach((c, i) => {
                const card = document.createElement('div');
                card.className = 'cmd-card';
                card.innerHTML = `
                    <div class="num">#${i+1}</div>
                    <div class="cmd">${c.cmd}</div>
                    <div class="desc">${c.desc}</div>
                    <button class="run" onclick="runCmd('${c.cmd}')">ÇALIŞTIR</button>
                `;
                grid.appendChild(card);
            });
        }

        /* Komut çalıştır */
        function runCmd(cmd) {
            showToast(`Çalıştırıldı: ${cmd} (demo)`);
        }

        /* Şarkı listesi */
        function renderMusic() {
            const list = document.getElementById('musicList');
            list.innerHTML = '';
            songs.forEach((s, i) => {
                const item = document.createElement('div');
                item.style.cssText = 'display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #1a1a1a;cursor:pointer;';
                item.innerHTML = `<span style="font-size:.85rem;">${String(i+1).padStart(2,'0')} ${s.n} - ${s.a}</span><span style="color:#e74c3c;">▶</span>`;
                item.onclick = () => {
                    showToast(`Çalınıyor: ${s.n} - ${s.a}`);
                    window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(s.n + ' ' + s.a)}`, '_blank');
                };
                list.appendChild(item);
            });
        }

        /* Modal kontrolleri */
        function toggleLogin() { document.getElementById('loginModal').classList.toggle('active'); }
        function toggleRegister() { document.getElementById('registerModal').classList.toggle('active'); }
        function toggleMusic() { document.getElementById('musicModal').classList.toggle('active'); }

        function doLogin() {
            const u = document.getElementById('loginUser').value;
            const p = document.getElementById('loginPass').value;
            if (u && p) { showToast(`Giriş başarılı: ${u} (demo)`); toggleLogin(); }
            else { showToast('Kullanıcı adı ve şifre gerekli'); }
        }

        function doRegister() {
            const u = document.getElementById('regUser').value;
            const m = document.getElementById('regMail').value;
            const p = document.getElementById('regPass').value;
            if (u && m && p) { showToast(`Kayıt başarılı: ${u} (demo)`); toggleRegister(); }
            else { showToast('Tüm alanları doldurun'); }
        }

        function toggleMenu() {
            showToast('Menü (demo)');
        }

        /* Bildirim */
        function showToast(text) {
            const t = document.getElementById('toast');
            t.textContent = text;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2500);
        }

        /* Başlat */
        renderCommands();
        renderMusic();
    </script>
</body>
</html>
