<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ALEXIX SİSTEM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Segoe UI',Roboto,sans-serif}
body{background:#000;color:#fff;overflow-x:hidden;padding-bottom:70px}

/* ÜST BAR */
.topbar{background:#0a0a0a;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:1px solid #1a1a1a}
.topbar .left{display:flex;align-items:center;gap:12px}
.hamburger{width:26px;height:20px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.hamburger span{display:block;height:3px;background:#e74c3c;border-radius:2px}
.logo{font-size:1.2rem;font-weight:800;letter-spacing:1px}
.topbar .right{display:flex;gap:6px}
.topbar .right button{background:transparent;border:1px solid #333;color:#fff;padding:6px 12px;border-radius:6px;font-size:.75rem;font-weight:600;cursor:pointer}
.topbar .right button:hover{background:#1a1a1a;border-color:#e74c3c}

/* ARAMA */
.search-bar{padding:12px 14px;background:#050505}
.search-bar input{width:100%;padding:12px 16px;background:#0d0d0d;border:1px solid #1f1f1f;border-radius:8px;color:#fff;font-size:.9rem;outline:none}
.search-bar input:focus{border-color:#e74c3c}

/* KOMUT GRID */
.cmd-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 14px 20px}
.cmd-card{background:#0d0d0d;border:1px solid #1f1f1f;border-radius:10px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;min-height:110px;cursor:pointer;transition:.2s}
.cmd-card:hover{border-color:#e74c3c;transform:translateY(-2px)}
.cmd-card .num{font-size:.65rem;color:#555;margin-bottom:4px}
.cmd-card .cmd{color:#e74c3c;font-weight:700;font-size:.82rem;word-break:break-all}
.cmd-card .desc{color:#888;font-size:.72rem;margin-top:4px;flex:1;line-height:1.3}
.cmd-card .run{align-self:flex-end;background:transparent;border:1px solid #444;color:#fff;padding:5px 14px;border-radius:6px;font-size:.7rem;font-weight:600;cursor:pointer;margin-top:8px}
.cmd-card .run:hover{background:#e74c3c;border-color:#e74c3c}

/* DETAY SAYFASI */
.detail-page{position:fixed;inset:0;background:#000;z-index:150;display:none;flex-direction:column;overflow-y:auto}
.detail-page.active{display:flex}
.detail-header{background:#0a0a0a;padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #1a1a1a;position:sticky;top:0;z-index:10}
.detail-header .back{color:#e74c3c;font-size:1.4rem;cursor:pointer;font-weight:700}
.detail-header .title{font-weight:700;font-size:1rem;color:#e74c3c}
.detail-body{padding:16px;flex:1}
.detail-body .sorgu-box{background:#0d0d0d;border:1px solid #1f1f1f;border-radius:10px;padding:16px;margin-bottom:14px}
.detail-body label{display:block;color:#aaa;font-size:.8rem;margin-bottom:6px;font-weight:600}
.detail-body input,.detail-body select{width:100%;padding:11px;background:#000;border:1px solid #2a2a2a;border-radius:8px;color:#fff;font-size:.9rem;outline:none;margin-bottom:12px}
.detail-body input:focus,.detail-body select:focus{border-color:#e74c3c}
.detail-body .execute-btn{width:100%;padding:13px;background:#e74c3c;border:none;border-radius:8px;color:#fff;font-weight:700;font-size:.9rem;cursor:pointer;letter-spacing:.5px}
.detail-body .execute-btn:hover{background:#c0392b}
.detail-body .result-box{background:#0d0d0d;border:1px solid #1f1f1f;border-radius:10px;padding:16px;margin-top:14px;font-family:monospace;font-size:.8rem;color:#2ecc71;white-space:pre-wrap;display:none}
.detail-body .result-box.active{display:block}
.detail-body .field-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1a1a1a;font-size:.82rem}
.detail-body .field-row .k{color:#888}
.detail-body .field-row .v{color:#fff;font-weight:600}

/* ALT BAR */
.bottombar{position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;border-top:1px solid #1a1a1a;padding:8px 14px;display:flex;align-items:center;justify-content:space-around;z-index:100}
.bottombar .icon{color:#666;font-size:1.3rem;cursor:pointer;padding:6px}
.bottombar .icon.active{color:#e74c3c}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;justify-content:center;align-items:center;z-index:200}
.modal.active{display:flex}
.modal-box{background:#0d0d0d;border:1px solid #222;border-radius:12px;padding:24px;width:90%;max-width:360px;max-height:80vh;overflow-y:auto}
.modal-box h2{color:#e74c3c;margin-bottom:16px;text-align:center;font-size:1.1rem}
.modal-box input{width:100%;padding:12px;margin-bottom:12px;background:#000;border:1px solid #333;border-radius:6px;color:#fff;outline:none}
.modal-box input:focus{border-color:#e74c3c}
.modal-box button{width:100%;padding:12px;background:#e74c3c;color:#fff;border:none;border-radius:6px;font-weight:700;cursor:pointer}
.modal-box .close{float:right;color:#e74c3c;cursor:pointer;font-size:1.2rem;font-weight:700}
.music-item{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #1a1a1a;cursor:pointer}
.music-item:hover{background:#1a1a1a}
.music-item span{font-size:.82rem}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#e74c3c;color:#fff;padding:10px 20px;border-radius:6px;font-size:.85rem;display:none;z-index:300;font-weight:600}
</style>
</head>
